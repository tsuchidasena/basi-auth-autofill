<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Auth Autofill — 設定</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Basic Auth Autofill</h1>
      <p class="sub">HTTP Basic 認証の資格情報を暗号化して管理します。</p>

      <!-- Setup / lock states -->
      <section id="gate" class="card" hidden>
        <h2 id="gate-title"></h2>
        <p id="gate-hint" class="hint"></p>
        <input id="gate-pw" type="password" placeholder="マスターパスワード" autocomplete="current-password" />
        <input id="gate-pw2" type="password" placeholder="確認のため再入力" autocomplete="new-password" hidden />
        <button id="gate-btn" class="primary"></button>
        <p id="gate-msg" class="msg" role="status"></p>
      </section>

      <!-- Manager -->
      <section id="manager" hidden>
        <div class="toolbar">
          <span id="status-badge" class="badge unlocked">解錠済み</span>
          <button id="lock-btn">施錠</button>
        </div>

        <div class="card">
          <h2>登録済みの資格情報</h2>
          <table id="entries-table">
            <thead>
              <tr><th>Host</th><th>ユーザ名</th><th>メモ</th><th></th></tr>
            </thead>
            <tbody id="entries-body"></tbody>
          </table>
          <p id="empty-note" class="hint" hidden>まだ登録がありません。</p>
        </div>

        <div class="card">
          <h2 id="form-title">新規登録</h2>
          <div class="grid">
            <label>Host
              <input id="f-host" type="text" placeholder="example.com / example.com:8443 / *.example.com" />
            </label>
            <label>ユーザ名
              <input id="f-user" type="text" autocomplete="off" />
            </label>
            <label>パスワード
              <input id="f-pass" type="password" autocomplete="off" />
            </label>
            <label>メモ（任意）
              <input id="f-label" type="text" autocomplete="off" />
            </label>
          </div>
          <div class="row">
            <button id="f-save" class="primary">保存</button>
            <button id="f-cancel" hidden>キャンセル</button>
          </div>
          <p id="form-msg" class="msg" role="status"></p>
        </div>

        <div class="card danger">
          <h2>金庫のリセット</h2>
          <p class="hint">マスターパスワードを忘れた場合など。<strong>全データが削除されます。</strong></p>
          <button id="reset-btn" class="danger-btn">すべて削除してリセット</button>
        </div>
      </section>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
